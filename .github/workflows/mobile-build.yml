name: Build Mobile APK

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Generate version
        run: echo "VERSION=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Update app metadata
        working-directory: mobile
        run: |
          jq ".expo.version = \"1.0.$VERSION\" | .expo.android.versionCode = $VERSION" app.json > tmp.json && mv tmp.json app.json
          jq ".version = \"1.0.$VERSION\"" package.json > tmp.json && mv tmp.json package.json
          echo "Updated to version 1.0.$VERSION"

      - name: Build APK (Local)
        working-directory: mobile
        run: |
          mkdir -p ../output
          eas build --platform android --profile production --local --non-interactive --output=../output/app.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Rename APK
        run: mv output/app.apk output/academic-planner-v${{ env.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ env.VERSION }}
          name: Academic Planner v${{ env.VERSION }}
          files: output/academic-planner-v${{ env.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
